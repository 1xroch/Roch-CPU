name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag (vX.Y.Z)
        required: true
        type: string
      commit_sha:
        description: Full source commit matching the draft release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libgl1-mesa-dev

      - name: Regression checks
        run: cargo test --release --locked

      - name: Build and package
        run: |
          version="${RELEASE_TAG#v}"
          cargo build --release --locked
          grep -q "^version = \"$version\"" Cargo.toml || { echo "Cargo.toml is not $version"; exit 1; }
          dir="Roch-CPU-$version-linux-x86_64"
          mkdir -p "$dir"
          install -m755 target/release/roch-cpu "$dir/rochcpu"
          strip "$dir/rochcpu"
          install -m755 packaging/linux/install.sh "$dir/install.sh"
          install -m644 packaging/linux/RochCPU.desktop "$dir/RochCPU.desktop"
          install -m644 assets/mark.png "$dir/RochCPU.png"
          cp LICENSE THIRD-PARTY-NOTICES.md "$dir/"
          cp -r docs "$dir/docs"
          tar -czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > linux.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: linux-package
          path: |
            Roch-CPU-*-linux-x86_64.tar.gz
            linux.sha256

  publish:
    needs: linux
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate release inputs
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected vX.Y.Z tag' }
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Expected full commit SHA' }

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Regression checks
        run: cargo test --release --locked

      - name: Build Windows package
        run: |
          cmd /c build.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          Move-Item -LiteralPath dist -Destination package

      - uses: actions/download-artifact@v7
        with:
          name: linux-package
          path: linux-package

      - name: Package and verify
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $info = (Get-Item -LiteralPath 'package/Roch CPU.exe').VersionInfo
          if ($info.FileVersion -ne "$version.0" -or $info.ProductVersion -ne "$version+$env:SOURCE_SHA") { throw 'Binary version or revision mismatch' }
          $driverHash = (Get-FileHash -LiteralPath 'package/WinRing0x64.sys').Hash
          if ($driverHash -ne '11BD2C9F9E2397C9A16E0990E4ED2CF0679498FE0FD418A3DFDAC60B5C160EE5') { throw 'Driver hash mismatch' }
          $moduleHash = (Get-FileHash -LiteralPath 'package/pawnio/RyzenSMU.bin').Hash
          if ($moduleHash -ne 'B84ECA7F32C63B3D8C14B2C6D45482706DF8683AA6F43EB8BEAD9DC62181D38F') { throw 'PawnIO module hash mismatch' }
          Copy-Item -LiteralPath 'LICENSE','THIRD-PARTY-NOTICES.md' -Destination package
          Copy-Item -LiteralPath docs -Destination package -Recurse
          $files = Get-ChildItem -LiteralPath package
          $zipName = "Roch-CPU-$version-win-x64.zip"
          Compress-Archive -LiteralPath $files.FullName -DestinationPath $zipName -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zipName).Hash.ToLowerInvariant()
          $linux = Get-ChildItem -LiteralPath linux-package -Filter 'Roch-CPU-*-linux-x86_64.tar.gz'
          if (!$linux) { throw 'Linux package missing' }
          Copy-Item -LiteralPath $linux.FullName -Destination .
          $linuxHash = (Get-FileHash -LiteralPath $linux.Name).Hash.ToLowerInvariant()
          $built = (Get-Content -LiteralPath linux-package/linux.sha256).Split(' ')[0]
          if ($built -ne $linuxHash) { throw 'Linux package hash changed in transit' }
          "$hash  $zipName", "$linuxHash  $($linux.Name)" | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii

      - name: Upload, verify and publish existing draft
        shell: pwsh
        run: |
          $api = "repos/$env:GITHUB_REPOSITORY"
          $releases = gh api "$api/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read release metadata' }
          $release = $releases | Where-Object tag_name -EQ $env:RELEASE_TAG
          if (!$release -or !$release.draft -or $release.target_commitish -ne $env:SOURCE_SHA) { throw 'Expected matching draft release' }
          $zipName = "Roch-CPU-$($env:RELEASE_TAG.Substring(1))-win-x64.zip"
          $linuxName = "Roch-CPU-$($env:RELEASE_TAG.Substring(1))-linux-x86_64.tar.gz"
          gh release upload $env:RELEASE_TAG $zipName $linuxName SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed; release remains a draft' }
          $assets = gh api "$api/releases/$($release.id)/assets" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify uploaded assets' }
          foreach ($name in @($zipName, $linuxName, 'SHA256SUMS.txt')) {
            $asset = $assets | Where-Object name -EQ $name
            $expected = 'sha256:' + (Get-FileHash -LiteralPath $name).Hash.ToLowerInvariant()
            if (!$asset -or $asset.state -ne 'uploaded' -or $asset.digest -ne $expected -or $asset.size -ne (Get-Item -LiteralPath $name).Length) { throw "Asset verification failed: $name" }
          }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed' }
