name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libgl1-mesa-dev

      - name: Regression checks
        # Simulated drivers and buses only; the pkexec helper is never started.
        run: cargo test --release --locked

      - name: Build and smoke-test without a desktop or root
        run: |
          cargo build --release --locked
          target/release/roch-cpu --help | grep -q 'LGA1851'
          # Not root and no helper allowed: the switch must refuse cleanly, not crash.
          ! ROCHCPU_NO_HELPER=1 target/release/roch-cpu --mailbox-scan scan.txt

  build:
    runs-on: windows-latest
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Regression checks
        # Unit tests use simulated drivers and buses; they never open the hardware driver.
        run: cargo test --release --locked

      - name: Build
        run: cmd /c build.cmd

      - name: Check the driver travelled with the build
        shell: pwsh
        run: |
          $sys = 'dist/WinRing0x64.sys'
          if (-not (Test-Path $sys)) { throw "$sys is missing from the build output" }
          $hash = (Get-FileHash $sys -Algorithm SHA256).Hash
          $expected = '11BD2C9F9E2397C9A16E0990E4ED2CF0679498FE0FD418A3DFDAC60B5C160EE5'
          if ($hash -ne $expected) { throw "WinRing0x64.sys hash $hash does not match $expected" }
          Write-Output "driver ok: $hash"
          $mod = 'dist/pawnio/RyzenSMU.bin'
          if (-not (Test-Path $mod)) { throw "$mod is missing from the build output" }
          $mhash = (Get-FileHash $mod -Algorithm SHA256).Hash
          if ($mhash -ne 'B84ECA7F32C63B3D8C14B2C6D45482706DF8683AA6F43EB8BEAD9DC62181D38F') { throw "RyzenSMU.bin hash $mhash is not the signed 0.2.4 module" }
          Write-Output "pawnio module ok: $mhash"

      - uses: actions/upload-artifact@v7
        with:
          name: RochCPU
          path: dist/
