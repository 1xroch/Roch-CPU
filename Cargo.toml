[package]
name = "roch-cpu"
version = "1.0.6"
edition = "2024"
description = "Roch CPU - open CPU tuning for LGA1700 and AMD Ryzen"
authors = ["Roch Studio"]
license-file = "LICENSE"
publish = false
build = "build.rs"

[[bin]]
name = "roch-cpu"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "persistence"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_EventLog",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
